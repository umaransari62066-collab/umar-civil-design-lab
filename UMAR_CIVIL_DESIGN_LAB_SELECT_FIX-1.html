*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#eee;font-family:Arial,sans-serif}button,input,select{font:inherit}button{touch-action:manipulation}.app{height:100%;display:flex;flex-direction:column}.top{height:50px;flex:none;background:#1b1d20;border-bottom:1px solid #444;display:flex;align-items:center;gap:5px;padding:0 7px;z-index:20}.logo{font-weight:800;color:#61bfff;font-size:13px;white-space:nowrap}.spacer{flex:1}.btn{background:#292c30;color:#eee;border:1px solid #555;border-radius:6px;padding:7px 9px;min-height:34px}.btn.active,.btn:active{background:#075d8e}.workspace{position:relative;flex:1;min-height:0}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#151719}.toolbar{position:absolute;left:7px;top:7px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 14px);z-index:5}.toolbar .btn{padding:6px 8px}.mobileZoom{display:flex;position:absolute;right:8px;top:7px;gap:4px;z-index:6}.panel{position:absolute;right:7px;top:7px;width:265px;max-height:calc(100% - 52px);overflow:auto;background:#1d2023f7;border:1px solid #555;border-radius:8px;padding:9px;z-index:15;transform:translateX(calc(100% + 12px));transition:.18s}.panel.open{transform:translateX(0)}h3{font-size:13px;color:#61bfff;margin:3px 0 8px}.section{border-bottom:1px solid #34383d;padding-bottom:9px;margin-bottom:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.row{display:flex;justify-content:space-between;align-items:center;gap:7px;padding:5px 2px;font-size:12px;border-bottom:1px solid #34383d}.row select,.row input{width:130px;background:#292c30;color:#eee;border:1px solid #555;border-radius:4px;padding:4px}.small{font-size:11px;color:#aaa;line-height:1.4}.command{position:absolute;left:7px;right:7px;bottom:7px;background:#1b1d20ee;border:1px solid #50545a;border-radius:6px;padding:7px 9px;color:#8dd7ff;font:12px monospace;z-index:5;pointer-events:none}.status{position:absolute;left:8px;bottom:48px;color:#777;font:10px monospace;z-index:4;pointer-events:none}.preview{pointer-events:none}@media(max-width:760px){.desktopOnly{display:none}.toolbar{top:55px;max-height:calc(100% - 110px);overflow:auto;padding-right:4px}.mobileZoom{top:7px}.command{bottom:6px}.status{bottom:48px}.panel{top:7px;width:250px}}@media print{.top,.toolbar,.mobileZoom,.panel,.command,.status{display:none!important}.workspace{position:fixed;inset:0}}
</style></head><body><div class="app"><header class="top"><div class="logo">🧠 UMAR CIVIL DESIGN LAB</div><span class="desktopOnly" style="font-size:10px;color:#999">MOBILE CIVIL CAD</span><div class="spacer"></div><button class="btn desktopOnly" onclick="newDrawing()">New</button><button class="btn" onclick="undo()">↶</button><button class="btn" onclick="redo()">↷</button><button class="btn desktopOnly" onclick="saveProject()">Save</button><button class="btn" onclick="togglePanel()">☰</button></header><main class="workspace"><canvas id="cad"></canvas><div class="toolbar" id="toolbar">

<aside class="panel" id="panel"><div class="section"><h3>DRAW & MODIFY</h3><div class="grid" id="panelTools"></div></div><div class="section"><h3>UNITS / GRID</h3><div class="row"><span>Display</span><select id="unit" onchange="unit=this.value;draw()"><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="ft">ft</option><option value="ftin">feet + inches</option></select></div><div class="row"><span>Grid mm</span><input id="grid" type="number" min="1" value="250" onchange="gridStep=Math.max(1,+this.value||250);draw()"></div><div class="grid"><button class="btn" onclick="toggleSnap()">Snap</button><button class="btn" onclick="toggleOrtho()">Ortho</button><button class="btn" onclick="toggleGrid()">Grid</button><button class="btn" onclick="fit()">Fit</button></div></div><div class="section"><h3>LAYERS</h3><div class="row"><span>Active</span><select id="layer" onchange="activeLayer=this.value"></select></div><div class="grid"><button class="btn" onclick="addLayer()">+ Layer</button><button class="btn" onclick="toggleLayer()">Show/Hide</button></div><div id="layerInfo" class="small"></div></div><div class="section"><h3>PROJECT</h3><div class="grid"><button class="btn" onclick="saveProject()">Save JSON</button><button class="btn" onclick="loadProject()">Load JSON</button><button class="btn" onclick="exportPNG()">PNG</button><button class="btn" onclick="exportSVG()">SVG</button><button class="btn" onclick="printPlan()">Print/PDF</button><button class="btn" onclick="newDrawing()">Clear</button></div></div><div class="section"><h3>SELECTED</h3><div id="props" class="small">Nothing selected.</div></div><div class="small">Mobile-first civil CAD learning app. Geometry is stored in millimetres. Verify construction drawings with a qualified professional.</div></aside></main></div>
<script>
'use strict';
const canvas=document.getElementById('cad'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;let zoom=1,view={x:0,y:0},objects=[],selected=-1,tool='select',activeLayer='WALL',unit='mm',gridStep=250,gridOn=true,snapOn=true,orthoOn=false;let undoStack=[],redoStack=[];let gesture=null,pinch=null;
const layerColors={WALL:'#e5e7e9',DOOR:'#ffd166',WINDOW:'#7de2ff',COLUMN:'#ff8c8c',BEAM:'#f59e0b',STAIR:'#b794f4',DIM:'#c6f6d5',ANNOTATION:'#fff'};let layers={WALL:true,DOOR:true,WINDOW:true,COLUMN:true,BEAM:true,STAIR:true,DIM:true,ANNOTATION:true};
const tools=['select','wall','polyline','room','line','rectangle','circle','door','window','column','beam','stair','dimension','erase','move','copy','rotate','mirror','offset','trim','pan'];const labels={select:'↖ Select',wall:'▤ Wall',polyline:'⌁ Poly',room:'□ Room',line:'╱ Line',rectangle:'▭ Rect',circle:'○ Circle',door:'🚪 Door',window:'▥ Window',column:'▦ Column',beam:'━ Beam',stair:'▥ Stair',dimension:'↔ Dim',erase:'⌫ Erase',move:'✥ Move',copy:'⧉ Copy',rotate:'⟳ Rotate',mirror:'⇋ Mirror',offset:'↔ Offset',trim:'✂ Trim',pan:'✋ Pan'};
function init(){tools.forEach(t=>{document.getElementById('panelTools').insertAdjacentHTML('beforeend',`<button class="btn" onclick="setTool('${t}')">${labels[t]}</button>`)});refreshLayers();resize();setTool('select')}
function resize(){W=canvas.clientWidth;H=canvas.clientHeight;dpr=Math.min(2,devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
addEventListener('resize',resize);
function screenToWorld(x,y){return{x:(x-view.x)/zoom,y:(y-view.y)/zoom}}function eventPoint(e){const r=canvas.getBoundingClientRect();return screenToWorld(e.clientX-r.left,e.clientY-r.top)}
function snap(p){return snapOn?{x:Math.round(p.x/gridStep)*gridStep,y:Math.round(p.y/gridStep)*gridStep}:p}function constrain(a,b){if(!orthoOn)return b;return Math.abs(b.x-a.x)>=Math.abs(b.y-a.y)?{x:b.x,y:a.y}:{x:a.x,y:b.y}}
function fmt(v){if(unit==='mm')return Math.round(v)+' mm';if(unit==='cm')return (v/10).toFixed(1).replace(/\.0$/,'')+' cm';if(unit==='m')return (v/1000).toFixed(3).replace(/0+$/,'').replace(/\.$/,'')+' m';if(unit==='ft')return (v/304.8).toFixed(2)+' ft';let i=v/25.4,f=Math.floor(i/12);return f+"'-"+(i-f*12).toFixed(1).replace(/\.0$/,'')+'"'}
function push(){undoStack.push(JSON.stringify(objects));if(undoStack.length>100)undoStack.shift();redoStack=[]}function undo(){if(!undoStack.length)return;redoStack.push(JSON.stringify(objects));objects=JSON.parse(undoStack.pop());selected=-1;draw();props()}function redo(){if(!redoStack.length)return;undoStack.push(JSON.stringify(objects));objects=JSON.parse(redoStack.pop());selected=-1;draw();props()}
function clone(o){return JSON.parse(JSON.stringify(o))}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle='#151719';ctx.fillRect(0,0,W,H);drawGrid();ctx.save();ctx.translate(view.x,view.y);ctx.scale(zoom,zoom);objects.forEach((o,i)=>{if(layers[o.layer]!==false)drawObj(o,i)});if(gesture)drawPreview();ctx.restore();updateStatus()}
function drawGrid(){if(!gridOn)return;const s=gridStep*zoom;if(s<5)return;let ox=((view.x%s)+s)%s,oy=((view.y%s)+s)%s;ctx.strokeStyle='#23292e';ctx.lineWidth=1;for(let x=ox;x<W;x+=s){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=oy;y<H;y+=s){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function baseStyle(o){ctx.strokeStyle=layerColors[o.layer]||'#fff';ctx.fillStyle='transparent';ctx.lineWidth=(o.type==='wall'?120:o.type==='beam'?150:5)/zoom;ctx.setLineDash([])}
function drawObj(o,i){baseStyle(o);if(o.type==='rect'||o.type==='room'){ctx.strokeRect(o.x,o.y,o.w,o.h)}else if(o.type==='circle'){ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.stroke()}else if(o.type==='column'){ctx.strokeRect(o.x-o.w/2,o.y-o.h/2,o.w,o.h);ctx.lineWidth=2/zoom;ctx.strokeRect(o.x-o.w/2+30,o.y-o.h/2+30,o.w-60,o.h-60)}else if(o.type==='poly'){ctx.beginPath();o.points.forEach((p,n)=>n?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke()}else if(o.type==='stair'){for(let n=0;n<=o.n;n++){let t=n/o.n,x=o.x1+(o.x2-o.x1)*t,y=o.y1+(o.y2-o.y1)*t;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-o.dy,y+o.dx);ctx.stroke()}}else if(o.type==='dim'){line(o);let l=Math.hypot(o.x2-o.x1,o.y2-o.y1);ctx.fillStyle=layerColors.DIM;ctx.font=`${16/zoom}px Arial`;ctx.fillText(fmt(l),(o.x1+o.x2)/2+8/zoom,(o.y1+o.y2)/2-8/zoom)}else{line(o);if(o.type==='window'){const dx=o.x2-o.x1,dy=o.y2-o.y1,l=Math.hypot(dx,dy)||1,nx=-dy/l*45,ny=dx/l*45;ctx.beginPath();ctx.moveTo(o.x1+nx,o.y1+ny);ctx.lineTo(o.x2+nx,o.y2+ny);ctx.moveTo(o.x1-nx,o.y1-ny);ctx.lineTo(o.x2-nx,o.y2-ny);ctx.stroke()}if(o.type==='door'){ctx.lineWidth=3/zoom;let r=Math.hypot(o.x2-o.x1,o.y2-o.y1);ctx.beginPath();ctx.arc(o.x1,o.y1,r,0,Math.PI/2);ctx.stroke()}}
if(i===selected){ctx.save();ctx.strokeStyle='#00ff9d';ctx.setLineDash([10/zoom,7/zoom]);ctx.lineWidth=3/zoom;let b=bounds(o);ctx.strokeRect(b.x-12/zoom,b.y-12/zoom,b.w+24/zoom,b.h+24/zoom);ctx.restore()}}
function line(o){ctx.beginPath();ctx.moveTo(o.x1,o.y1);ctx.lineTo(o.x2,o.y2);ctx.stroke()}
function bounds(o){if(o.x1!==undefined)return{x:Math.min(o.x1,o.x2),y:Math.min(o.y1,o.y2),w:Math.abs(o.x2-o.x1),h:Math.abs(o.y2-o.y1)};if(o.type==='circle')return{x:o.x-o.r,y:o.y-o.r,w:o.r*2,h:o.r*2};if(o.points){let xs=o.points.map(p=>p.x),ys=o.points.map(p=>p.y);return{x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)}}return{x:o.x,y:o.y,w:o.w||0,h:o.h||0}}
function drawPreview(){let g=gesture,a= g.start,b=g.current;if(g.type==='poly'){ctx.strokeStyle='#00ff9d';ctx.setLineDash([10/zoom,7/zoom]);ctx.lineWidth=4/zoom;ctx.beginPath();g.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);return}let o=makeObject(g.type,a,b,true);if(o){ctx.save();ctx.globalAlpha=.8;drawObj(o,-2);ctx.restore()}}
function makeObject(t,a,b,preview=false){b=constrain(a,b);if(t==='room'||t==='rectangle')return{type:t==='room'?'room':'rect',layer:'WALL',x:Math.min(a.x,b.x),y:Math.min(a.y,b.y),w:Math.abs(b.x-a.x),h:Math.abs(b.y-a.y)};if(t==='circle')return{type:'circle',layer:activeLayer,x:a.x,y:a.y,r:Math.hypot(b.x-a.x,b.y-a.y)};if(t==='dimension')return{type:'dim',layer:'DIM',x1:a.x,y1:a.y,x2:b.x,y2:b.y};if(t==='stair'){let dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1;return{type:'stair',layer:'STAIR',x1:a.x,y1:a.y,x2:b.x,y2:b.y,n:12,dx:-dy/l*30,dy:dx/l*30}}let layer=t==='wall'?'WALL':t==='door'?'DOOR':t==='window'?'WINDOW':t==='beam'?'BEAM':'ANNOTATION';return{type:t,layer,x1:a.x,y1:a.y,x2:b.x,y2:b.y}}
function setTool(t){tool=t;gesture=null;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));document.getElementById('command').textContent=(labels[t]||t).toUpperCase()+' — '+({select:'Tap an object.',wall:'Drag wall.',polyline:'Tap points; double-tap to finish.',room:'Drag room.',line:'Drag line.',rectangle:'Drag rectangle.',circle:'Drag radius.',door:'Drag opening.',window:'Drag window.',column:'Tap to place.',beam:'Drag beam.',stair:'Drag stair.',dimension:'Drag dimension.',erase:'Tap object.',move:'Tap object then drag.',copy:'Tap object then drag.',rotate:'Tap object; enter angle.',mirror:'Tap object then drag mirror axis.',offset:'Tap line; enter offset.',trim:'Tap object.',pan:'Drag canvas.'}[t]||'Ready.');draw()}
function hit(p){
  // Selection deliberately does NOT snap to the grid. A tap should select the object
  // where the user's finger actually lands.
  const tol=Math.max(14/zoom,5);
  for(let i=objects.length-1;i>=0;i--){
    const o=objects[i];
    if(layers[o.layer]===false)continue;
    if(o.x1!==undefined){
      const dx=o.x2-o.x1,dy=o.y2-o.y1;
      const t=Math.max(0,Math.min(1,((p.x-o.x1)*dx+(p.y-o.y1)*dy)/(dx*dx+dy*dy||1)));
      const q={x:o.x1+t*dx,y:o.y1+t*dy};
      const lineTol=Math.max(tol,(o.type==='wall'?70:o.type==='beam'?80:35)/zoom);
      if(Math.hypot(p.x-q.x,p.y-q.y)<=lineTol)return i;
    }else if(o.type==='circle'){
      if(Math.abs(Math.hypot(p.x-o.x,p.y-o.y)-o.r)<=tol)return i;
    }else if(o.points){
      for(let j=1;j<o.points.length;j++){
        const a=o.points[j-1],b=o.points[j],dx=b.x-a.x,dy=b.y-a.y;
        const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1)));
        if(Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy))<=Math.max(tol,35/zoom))return i;
      }
    }else{
      const b=bounds(o),pad=tol;
      if(p.x>=b.x-pad&&p.x<=b.x+b.w+pad&&p.y>=b.y-pad&&p.y<=b.y+b.h+pad)return i;
    }
  }
  return -1;
}

function getXY(e){let r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'&&touchCount()>=2)return;canvas.setPointerCapture(e.pointerId);let s=getXY(e),p=snap(screenToWorld(s.x,s.y));if(tool==='select'){const exact=screenToWorld(s.x,s.y);selected=hit(exact);document.getElementById('command').textContent=selected>=0?('SELECT — Selected '+objects[selected].type.toUpperCase()+' on '+objects[selected].layer+'.'): 'SELECT — No object at that point.';props();draw();return}if(tool==='column'){push();objects.push({type:'column',layer:'COLUMN',x:p.x,y:p.y,w:300,h:300});selected=objects.length-1;draw();props();return}if(['erase','trim'].includes(tool)){let i=hit(p);if(i>=0){push();objects.splice(i,1);selected=-1;draw();props()}return}if(['move','copy'].includes(tool)){let i=hit(p);if(i>=0){selected=i;gesture={kind:'modify',start:p,current:p,base:clone(objects[i]),original:i,copy:tool==='copy'};draw()}return}if(tool==='rotate'){let i=hit(p);if(i>=0){selected=i;let a=prompt('Rotation angle (degrees):','90');if(a!==null){push();rotate(objects[i],(+a||0)*Math.PI/180);draw();props()} }return}if(tool==='offset'){let i=hit(p);if(i>=0&&objects[i].x1!==undefined){let d=prompt('Offset distance (mm):','150');if(d!==null){push();offset(objects[i],+d||0);draw();props()}}return}if(tool==='mirror'){let i=hit(p);if(i>=0){selected=i;gesture={kind:'mirror',start:p,current:p,base:clone(objects[i])};draw()}return}if(tool==='polyline'){if(!gesture){gesture={kind:'poly',type:'poly',points:[p],start:p,current:p}}else{gesture.points.push(p);gesture.current=p}draw();return}gesture={kind:'draw',type:tool,start:p,current:p};draw()});
canvas.addEventListener('pointermove',e=>{let s=getXY(e),p=snap(screenToWorld(s.x,s.y));if(pinch)return;if(!gesture)return;if(gesture.kind==='modify'){let dx=p.x-gesture.start.x,dy=p.y-gesture.start.y;if(gesture.copy){let cp=clone(gesture.base);moveObj(cp,dx,dy);gesture.temp=cp}else{let cp=clone(gesture.base);moveObj(cp,dx,dy);gesture.temp=cp}gesture.current=p}else if(gesture.kind==='mirror'){gesture.current=p}else if(gesture.kind==='draw'||gesture.kind==='poly'){gesture.current=p}draw()});
canvas.addEventListener('pointerup',e=>{let s=getXY(e),p=snap(screenToWorld(s.x,s.y));if(!gesture)return;if(gesture.kind==='modify'){if(Math.hypot(p.x-gesture.start.x,p.y-gesture.start.y)>1){push();if(gesture.copy){objects.push(gesture.temp);selected=objects.length-1}else{objects[gesture.original]=gesture.temp}}gesture=null;draw();props();return}if(gesture.kind==='mirror'){push();mirror(gesture.base,gesture.start,p);objects[gesture.original]=gesture.base;gesture=null;draw();return}if(gesture.kind==='poly'){gesture.current=p;if(gesture.points.length>=2&&Math.hypot(p.x-gesture.points[0].x,p.y-gesture.points[0].y)<40/zoom){if(gesture.points.length>2)gesture.points.pop();push();objects.push({type:'poly',layer:activeLayer,points:gesture.points.slice()});gesture=null;draw()}return}let b=constrain(gesture.start,p);if(Math.hypot(b.x-gesture.start.x,b.y-gesture.start.y)<3&&tool!=='circle'){gesture=null;draw();return}push();objects.push(makeObject(gesture.type,gesture.start,b));selected=objects.length-1;gesture=null;draw();props()});
canvas.addEventListener('pointercancel',()=>{gesture=null;pinch=null;draw()});canvas.addEventListener('dblclick',()=>{if(gesture&&gesture.kind==='poly'&&gesture.points.length>=2){push();objects.push({type:'poly',layer:activeLayer,points:gesture.points.slice()});gesture=null;draw()}});
let activePointers=new Map();canvas.addEventListener('pointerdown',e=>{activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===2){gesture=null;let a=[...activePointers.values()];pinch={dist:Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),zoom,mid:{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}}});canvas.addEventListener('pointermove',e=>{if(activePointers.has(e.pointerId))activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===2){let a=[...activePointers.values()],dist=Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y),mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};if(!pinch)pinch={dist,zoom,mid};let factor=dist/pinch.dist,newZoom=Math.max(.15,Math.min(8,pinch.zoom*factor));let before=screenToWorld(pinch.mid.x-canvas.getBoundingClientRect().left,pinch.mid.y-canvas.getBoundingClientRect().top);zoom=newZoom;let r=canvas.getBoundingClientRect();let sx=mid.x-r.left,sy=mid.y-r.top;view.x=sx-before.x*zoom;view.y=sy-before.y*zoom;draw()}});['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,e=>{activePointers.delete(e.pointerId);if(activePointers.size<2)pinch=null}));
canvas.addEventListener('wheel',e=>{e.preventDefault();let r=canvas.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top;zoomAt(sx,sy,e.deltaY<0?1.15:.87)},{passive:false});
function zoomAt(sx,sy,f){let p=screenToWorld(sx,sy);zoom=Math.max(.15,Math.min(8,zoom*f));view.x=sx-p.x*zoom;view.y=sy-p.y*zoom;draw()}
function moveObj(o,dx,dy){if(o.x1!==undefined){o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}else if(o.points)o.points.forEach(p=>{p.x+=dx;p.y+=dy});else{o.x+=dx;o.y+=dy}}
function rotate(o,a){let b=bounds(o),cx=b.x+b.w/2,cy=b.y+b.h/2;function rp(x,y){let dx=x-cx,dy=y-cy;return{x:dx*Math.cos(a)-dy*Math.sin(a)+cx,y:dx*Math.sin(a)+dy*Math.cos(a)+cy}}if(o.x1!==undefined){let p=rp(o.x1,o.y1),q=rp(o.x2,o.y2);o.x1=p.x;o.y1=p.y;o.x2=q.x;o.y2=q.y}else if(o.points)o.points=o.points.map(p=>rp(p.x,p.y));else if(o.type==='circle'){} }
function mirror(o,a,b){let dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1,m=(x,y)=>{let px=x-a.x,py=y-a.y,t=(px*dx+py*dy)/l,qx=a.x+t*dx,qy=a.y+t*dy;return{x:2*qx-x,y:2*qy-y}};if(o.x1!==undefined){let p=m(o.x1,o.y1),q=m(o.x2,o.y2);o.x1=p.x;o.y1=p.y;o.x2=q.x;o.y2=q.y}else if(o.points)o.points=o.points.map(p=>m(p.x,p.y));else{o.x=m(o.x,o.y).x;o.y=m(o.x,o.y).y}}
function offset(o,d){let dx=o.x2-o.x1,dy=o.y2-o.y1,l=Math.hypot(dx,dy)||1,nx=-dy/l*d,ny=dx/l*d;o.x1+=nx;o.x2+=nx;o.y1+=ny;o.y2+=ny}
function props(){let el=document.getElementById('props');if(selected<0||!objects[selected]){el.textContent='Nothing selected.';return}let o=objects[selected],b=bounds(o),s='Type: '+o.type.toUpperCase()+' | Layer: '+o.layer;if(o.x1!==undefined)s+=' | Length: '+fmt(Math.hypot(o.x2-o.x1,o.y2-o.y1));else if(o.type==='circle')s+=' | Radius: '+fmt(o.r);else s+=' | '+fmt(b.w)+' × '+fmt(b.h);el.textContent=s}
function togglePanel(){document.getElementById('panel').classList.toggle('open')}function toggleSnap(){snapOn=!snapOn;draw()}function toggleOrtho(){orthoOn=!orthoOn;draw()}function toggleGrid(){gridOn=!gridOn;draw()}
function fit(){if(!objects.length){zoom=1;view={x:W/2,y:H/2};draw();return}let bs=objects.map(bounds),minx=Math.min(...bs.map(b=>b.x)),miny=Math.min(...bs.map(b=>b.y)),maxx=Math.max(...bs.map(b=>b.x+b.w)),maxy=Math.max(...bs.map(b=>b.y+b.h)),pad=400;zoom=Math.min(W/(maxx-minx+pad),H/(maxy-miny+pad),2);view={x:W/2-(minx+maxx)*zoom/2,y:H/2-(miny+maxy)*zoom/2};draw()}
function newDrawing(){if(confirm('Clear current drawing?')){objects=[];undoStack=[];redoStack=[];selected=-1;fit();props()}}function refreshLayers(){let s=document.getElementById('layer');s.innerHTML=Object.keys(layers).map(x=>`<option>${x}</option>`).join('');s.value=activeLayer;document.getElementById('layerInfo').textContent=Object.entries(layers).map(([k,v])=>k+':'+(v?'ON':'OFF')).join(' • ')}function addLayer(){let n=prompt('Layer name:');if(n){n=n.trim().toUpperCase();if(n&&!layers[n])layers[n]=true;activeLayer=n;refreshLayers()}}function toggleLayer(){layers[activeLayer]=layers[activeLayer]===false;refreshLayers();draw()}
function saveProject(){let blob=new Blob([JSON.stringify({version:3,objects,zoom,view,unit,gridStep,gridOn,snapOn,orthoOn,layers,activeLayer},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='umar-civil-design-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function loadProject(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);objects=x.objects||[];zoom=x.zoom||1;view=x.view||{x:W/2,y:H/2};unit=x.unit||'mm';gridStep=x.gridStep||250;gridOn=x.gridOn!==false;snapOn=x.snapOn!==false;orthoOn=!!x.orthoOn;layers=x.layers||layers;activeLayer=x.activeLayer||'WALL';document.getElementById('unit').value=unit;document.getElementById('grid').value=gridStep;refreshLayers();draw()}catch(e){alert('Invalid project file')}};r.readAsText(f)};i.click()}
function exportPNG(){let a=document.createElement('a');a.download='umar-civil-plan.png';a.href=canvas.toDataURL('image/png');a.click()}function exportSVG(){let body=objects.filter(o=>layers[o.layer]!==false).map(o=>{let c=layerColors[o.layer]||'#fff';if(o.x1!==undefined)return`<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="${c}" stroke-width="${o.type==='wall'?120:5}"/>`;if(o.type==='circle')return`<circle cx="${o.x}" cy="${o.y}" r="${o.r}" fill="none" stroke="${c}" stroke-width="5"/>`;if(o.points)return`<polyline points="${o.points.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${c}" stroke-width="5"/>`;return`<rect x="${o.x}" y="${o.y}" width="${o.w||0}" height="${o.h||0}" fill="none" stroke="${c}" stroke-width="5"/>`}).join('');let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5000 5000">${body}</svg>`,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.download='umar-civil-plan.svg';a.click()}function printPlan(){window.print()}
function touchCount(){return activePointers.size}
addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}else if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}else if(e.key==='Escape'){gesture=null;setTool('select')}});init();
